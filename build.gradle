plugins {
    id 'java'
    id 'maven-publish'

    id "me.shedaniel.unified-publishing" version "0.1.+"

    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

java.toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
java.withSourcesJar()

sourceSets.main.resources.srcDirs += "src/main/generated"

group = 'wootrevived'
archivesBaseName = "woot-revived"
def buildVersion = "${mod_version}"
version = "${mc_version}-${buildVersion}"

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id

        systemProperty "guideme.woot_revived.guide.sources", file("src/main/resources/assets/woot_revived/guidebook").getAbsolutePath()
        systemProperty "guideme.woot_revived.guide.sourcesNamespace", "woot_revived"
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    data {
        workingDirectory project.file('run-data')

        arguments.addAll '--mod', mod_id, '--all', '--output', file('src/main/generated/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'file': [
                        'modId': mod_id,
                        'jarVersion': mod_version
                ],
                'mc_version': mc_version,
                'neo_version': neo_version,
                'guideme_version': guideme_version,
                'jei_version': jei_version,
                'jade_version': jade_version,
                'kubejs_version': kubejs_version,
                'neo_major_version': neo_version.split('\\.')[0]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.creeperhost.net" }
    maven { url = "https://maven.architectury.dev" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly 'org.jetbrains:annotations:22.0.0'

    // JEI
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Jade
    implementation "maven.modrinth:jade:${jade_version}-neoforge"

    // GuideME
    implementation "maven.modrinth:guideme:${guideme_version}"

    // KubeJS
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation "maven.modrinth:kubejs:${kubejs_version}+KubeJS-1.20.4"
    implementation "curse.maven:rhino-416294:5296113"

    // Optimizations
    localRuntime "org.embeddedt:embeddium-${mc_version}:${embeddium_version}"
    localRuntime "maven.modrinth:modernfix:${modernfix_version}"
    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

jar {
    exclude '.cache/**'
    manifest {
        attributes([
                'Specification-Title'     : "${mod_name}",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'woot_revived.mixins.json'
        ])
    }
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'

    from(sourceSets.main.output) {
        include 'wootrevived/api/**'
    }

    // keep your manifest branding (adjust if you want different values)
    manifest {
        attributes([
                'Specification-Title'     : "${mod_name} API",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "api-${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('apiSourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'api-sources'

    from(sourceSets.main.allSource) {
        include 'wootrevived/api/**'
    }

    manifest {
        attributes([
                'Specification-Title'     : "${mod_name} API",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "api-${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.assemble {
    dependsOn tasks.named('apiJar')
    dependsOn tasks.named('apiSourcesJar')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}