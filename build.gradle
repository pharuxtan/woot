plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'

    id "me.shedaniel.unified-publishing" version "0.1.+"

    id 'net.neoforged.moddev' version '2.0.124'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
java.withSourcesJar()

sourceSets.main.resources.srcDirs += "src/main/generated/client"
sourceSets.main.resources.srcDirs += "src/main/generated/server"

group = 'wootrevived'
def buildVersion = "${mod_version}"
version = "${buildVersion}"

base {
    archivesName = "woot-revived"
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            jvmArguments.addAll "-Dmixin.debug=true", "-Dmixin.checks.interfaces=true", "-Dmixin.debug.export=true"
        }

        client {
            client()

            gameDirectory = file('runs/client')

            systemProperty "guideme.woot_revived.guide.sources", file("src/main/resources/assets/woot_revived/guidebook").getAbsolutePath()
            systemProperty "guideme.woot_revived.guide.sourcesNamespace", "woot_revived"
        }

        clientData {
            clientData()

            gameDirectory = file('runs/data')

            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/main/generated/client/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()

            gameDirectory = file('runs/data')

            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/main/generated/server/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        server {
            server()

            gameDirectory = file('runs/server')

            programArgument '--nogui'
        }
    }

    mods {
        woot_revived {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            mc_version        : mc_version,
            neo_version       : neo_version,
            guideme_version   : guideme_version,
            jei_version       : jei_version,
            jade_version      : jade_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.creeperhost.net" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.jetbrains:annotations:22.0.0'

    // JEI
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Jade
    implementation "maven.modrinth:jade:${jade_version}"

    // GuideME
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"

    // Optimizations
    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
}

jar {
    exclude '.cache/**'
    manifest {
        attributes([
                'Specification-Title'     : "${mod_name}",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'

    from(sourceSets.main.output) {
        include 'wootrevived/api/**'
    }

    // keep your manifest branding (adjust if you want different values)
    manifest {
        attributes([
                'Specification-Title'     : "${mod_name} API",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "api-${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('apiSourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'api-sources'

    from(sourceSets.main.allSource) {
        include 'wootrevived/api/**'
    }

    manifest {
        attributes([
                'Specification-Title'     : "${mod_name} API Sources",
                'Specification-Vendor'    : 'pharuxtan',
                'Specification-Version'   : "${mc_version}",
                'Implementation-Title'    : "${mod_id}",
                'Implementation-Vendor'   : 'pharuxtan',
                'Implementation-Version'  : "api-${mod_version}",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.assemble {
    dependsOn tasks.named('apiJar')
    dependsOn tasks.named('apiSourcesJar')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}