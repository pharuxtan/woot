name: Build 1.20.4

on:
  push:
    branches:
      - 1.20.4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false  # Allow writes to the cache

      - name: Build with Gradle
        run: |
          ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Woot Revived 1.20.4 ${{ steps.var.outputs.commit_hash }}
          path: build/libs